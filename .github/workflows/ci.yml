name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mod builds need the game's assemblies, which never leave this machine, so CI
# covers the capture tooling only. See AGENTS.md "Validation" for local checks.
jobs:
  catalog:
    name: Catalog tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install catalog dependencies
        run: python -m pip install --target .cache/catalog-python -r tools/game_catalog/requirements.txt
      - name: Catalog tests
        run: python tools/game_catalog/test_catalog.py --python-packages .cache/catalog-python
      - name: Timing tests
        run: python tools/game_catalog/test_timing.py

  catalog-windows:
    name: Catalog tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install catalog dependencies
        run: python -m pip install --target .cache/catalog-python -r tools/game_catalog/requirements.txt
      - name: Catalog tests
        run: python tools/game_catalog/test_catalog.py --python-packages .cache/catalog-python
      - name: Timing tests
        run: python tools/game_catalog/test_timing.py
      - name: Decompile/wiki handoff tests
        run: pwsh -NoProfile -File tools/Test-DecompileWikiHandoff.ps1

  powershell:
    name: PowerShell parse check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem tools -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
